<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>بطاقة تنفيذ برنامج نشاط طلابي - تفاعلية</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root{--ink:#103e4d;--line:#20596a;--accent:#0f7e8a;--bg:#eef4f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#123;direction:rtl}
  .toolbar{position:sticky;top:0;z-index:50;background:#fff;padding:10px;border-bottom:1px solid #ccdbe0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button,.fileBtn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;background:var(--accent);color:white;box-shadow:0 1px 4px #0002}
  button.secondary,.fileBtn.secondary{background:#536c75}
  button.danger{background:#9b3f3f}
  #filePicker{display:none}
  .status{width:100%;text-align:center;font-size:13px;color:#365;min-height:18px}
  .wrap{max-width:920px;margin:14px auto 40px;padding:0 10px}
  .card-shell{position:relative;width:min(100%,828px);margin:auto;aspect-ratio:828/1185;background:white;box-shadow:0 4px 18px #0003}
  .card-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
  .field{position:absolute;border:0;background:rgba(255,255,255,.03);color:#0b3440;font-weight:600;text-align:center;outline:none;padding:2px 5px;font-size:clamp(10px,1.8vw,17px);direction:rtl}
  .field:focus{background:rgba(255,255,255,.82);box-shadow:inset 0 0 0 1px #4bb4c6}
  textarea.field{resize:none;text-align:right;padding:6px}
  .mini{font-size:clamp(9px,1.5vw,14px)}
  .sig{position:absolute;border:1px dashed rgba(15,126,138,.45);background:rgba(255,255,255,.08);touch-action:none}
  .sig.active{background:rgba(255,255,255,.5)}
  .sigLabel{position:absolute;font-size:10px;color:#0a6872;background:#fff8;border-radius:4px;padding:1px 4px;pointer-events:none}
  .attachments{max-width:828px;margin:14px auto;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 10px #0001}
  .attachments h3{margin:0 0 8px;font-size:16px}
  .attachments p{margin:4px 0 8px;font-size:13px;color:#4a5d65;line-height:1.6}
  #filesList{font-size:13px;direction:rtl}
  .fileItem{padding:6px 8px;border:1px solid #dde8eb;border-radius:8px;margin:5px 0;background:#fafcfd;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .fileItem button{padding:5px 8px;font-size:12px;background:#9b3f3f}
  .radioLayer{position:absolute;display:flex;flex-direction:column;gap:2px;align-items:flex-start;direction:rtl;font-size:clamp(8px,1.2vw,11px)}
  .radioLayer label{display:flex;gap:3px;align-items:center;white-space:nowrap;background:#fff0}
  .radioLayer input{width:12px;height:12px;margin:0}
  @media (max-width:600px){.toolbar{padding:8px 6px}.toolbar button,.fileBtn{padding:9px 10px;font-size:13px}}
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <label class="fileBtn" for="filePicker">📎 إضافة صور أو ملفات PDF</label>
  <input id="filePicker" type="file" accept="image/*,application/pdf,.pdf" multiple />
  <button id="exportBtn">⬇️ تنزيل PDF جديد</button>
  <button class="secondary" id="saveBtn">💾 حفظ البيانات على الجهاز</button>
  <button class="danger" id="clearBtn">🗑️ مسح</button>
  <div class="status" id="status"></div>
</div>

    <!-- تذييل مبسط حسب الطلب -->
    <div id="footerClean" style="position:absolute;left:1.6%;right:1.6%;top:83.2%;height:15.4%;background:#fff;z-index:8;border-top:1px solid #2b6574;display:flex;align-items:center;justify-content:center;gap:8%;padding:0 4%;box-sizing:border-box;direction:rtl;font-weight:700;color:#173f4c;font-size:clamp(10px,1.6vw,15px)">

        <span>تنفيذ المعلمة :</span>

    <div id="filesList">لا توجد مرفقات.</div>
  </div>

<script>
const picker = document.getElementById('filePicker');
const listEl = document.getElementById('filesList');
const statusEl = document.getElementById('status');
let files = [];

function setStatus(t){statusEl.textContent=t||''}
function renderFiles(){
  if(!files.length){listEl.textContent='لا توجد مرفقات.';return}
  listEl.innerHTML='';
  files.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='fileItem';
    const n=document.createElement('span'); n.textContent=`${i+1}. ${f.name}`;
    const b=document.createElement('button'); b.textContent='حذف'; b.onclick=()=>{files.splice(i,1);renderFiles()};
    d.append(n,b); listEl.appendChild(d);
  })
}
picker.addEventListener('change',e=>{
  const chosen=[...e.target.files].filter(f=>f.type.startsWith('image/')||f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));
  files.push(...chosen); renderFiles(); picker.value='';
});

function setupSignature(canvas){
  const ctx=canvas.getContext('2d'); ctx.lineWidth=2.3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0a3440';
  let down=false;
  function pos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
  canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);canvas.classList.add('active')});
  canvas.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
  canvas.addEventListener('pointerup',()=>down=false); canvas.addEventListener('pointercancel',()=>down=false);
  canvas._clear=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
}

function collect(){
  const data={}; document.querySelectorAll('[data-k]').forEach(el=>data[el.dataset.k]=el.value);
  data.icon=(document.querySelector('input[name="icon"]:checked')||{}).value||'';
  return data;
}
function restore(data){
  if(!data)return; document.querySelectorAll('[data-k]').forEach(el=>{if(data[el.dataset.k]!=null)el.value=data[el.dataset.k]});
  if(data.icon){const r=[...document.querySelectorAll('input[name="icon"]')].find(x=>x.value===data.icon); if(r)r.checked=true}
}
document.getElementById('saveBtn').onclick=()=>{localStorage.setItem('activityCard1448',JSON.stringify(collect()));setStatus('تم حفظ البيانات على هذا الجهاز. المرفقات لا تُحفظ محليًا.')};
try{restore(JSON.parse(localStorage.getItem('activityCard1448')||'null'))}catch(e){}
document.getElementById('clearBtn').onclick=()=>{
  if(!confirm('مسح جميع البيانات والمرفقات؟'))return;
  document.querySelectorAll('[data-k]').forEach(el=>{el.value=''}); document.querySelectorAll('input[name="icon"]').forEach(x=>x.checked=false);
  files=[]; renderFiles(); localStorage.removeItem('activityCard1448'); setStatus('تم المسح.');
};

async function imgFileToPage(pdfDoc,file){
  const bytes=await file.arrayBuffer(); let img;
  if(file.type==='image/png'||file.name.toLowerCase().endsWith('.png')) img=await pdfDoc.embedPng(bytes); else img=await pdfDoc.embedJpg(bytes);
  const page=pdfDoc.addPage([595.28,841.89]); const pw=page.getWidth(),ph=page.getHeight(),margin=28;
  const scale=Math.min((pw-2*margin)/img.width,(ph-2*margin)/img.height); const w=img.width*scale,h=img.height*scale;
  page.drawImage(img,{x:(pw-w)/2,y:(ph-h)/2,width:w,height:h});
}

function downloadPdfBlob(bytes,fileName){
  const blob = new Blob([bytes],{type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),120000);
}

async function exportPDF(){
  if(!window.html2canvas||!window.PDFLib){alert('يلزم اتصال بالإنترنت أول مرة لتحميل مكتبة التصدير.');return}
  setStatus('جاري إنشاء ملف PDF...'); document.activeElement?.blur();
  const card=document.getElementById('card');
  const execInput=document.getElementById('execNameInput');
  const execPrint=document.getElementById('execNamePrint');
  execPrint.textContent=execInput.value||''; execInput.style.display='none'; execPrint.style.display='inline-block';
  const canvas=await html2canvas(card,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
  execInput.style.display='inline-block'; execPrint.style.display='none';
  const pngBytes=await fetch(canvas.toDataURL('image/png')).then(r=>r.arrayBuffer());
  const {PDFDocument}=PDFLib; const pdfDoc=await PDFDocument.create(); const p=pdfDoc.addPage([595.28,841.89]);
  const img=await pdfDoc.embedPng(pngBytes); p.drawImage(img,{x:0,y:0,width:p.getWidth(),height:p.getHeight()});

  for(const f of files){
    try{
      if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){
        const src=await PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});
        const pages=await pdfDoc.copyPages(src,src.getPageIndices()); pages.forEach(pg=>pdfDoc.addPage(pg));
      }else if(f.type.startsWith('image/')){
        await imgFileToPage(pdfDoc,f);
      }
    }catch(err){
      console.warn('تعذر دمج',f.name,err);
      try{await pdfDoc.attach(await f.arrayBuffer(),f.name,{mimeType:f.type||'application/octet-stream',description:'Attachment from activity card'});}catch(e){}
    }
  }

  const out=await pdfDoc.save(window.__activityCardUniquePdfName());
  const fileName='بطاقة_تنفيذ_برنامج_نشاط_طلابي.pdf';
  downloadPdfBlob(out,fileName);
  setStatus('تم إنشاء ملف PDF وتنزيله. افتحيه من «الملفات» ثم شاركي الملف نفسه إلى واتساب.');
}
document.getElementById('exportBtn').onclick=exportPDF;
renderFiles();
</script>

<script>
(function () {
  window.__activityCardUniquePdfName = function () {
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return `بطاقة_النشاط_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}.pdf`;
  };
  // This version intentionally does not use navigator.share.
})();
</script>
